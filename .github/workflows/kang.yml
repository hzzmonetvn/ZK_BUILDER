name: ROM Comparison Tool

on:
  workflow_dispatch:
    inputs:
      rom_url_1:
        description: 'Đường dẫn tải ROM 1 (ROM gốc / cũ)'
        required: true
        type: string
      rom_url_2:
        description: 'Đường dẫn tải ROM 2 (ROM mới)'
        required: true
        type: string
      partitions:
        description: 'Các phân vùng cần so sánh; để trống sẽ tự động lấy tất cả phân vùng trong super'
        required: false
        default: ''
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder (main branch)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          path: builder

      - name: Set up tools permissions
        run: |
          chmod +x builder/tools/payload
          chmod +x builder/tools/extract.erofs
          chmod +x builder/tools/py/lpunpack.py

      - name: Download ROMs
        env:
          ROM_URL_1: ${{ inputs.rom_url_1 }}
          ROM_URL_2: ${{ inputs.rom_url_2 }}
        run: |
          mkdir -p rom1_temp rom2_temp
          echo "Downloading ROM 1..."
          aria2c -s 16 -x 16 -o rom1_temp/rom1.zip "$ROM_URL_1" &
          download1_pid=$!
          echo "Downloading ROM 2..."
          aria2c -s 1 -x 1 -o rom2_temp/rom2.zip "$ROM_URL_2" &
          download2_pid=$!
          download1_status=0
          download2_status=0
          wait "$download1_pid" || download1_status=$?
          wait "$download2_pid" || download2_status=$?
          [ "$download1_status" -eq 0 ] && [ "$download2_status" -eq 0 ]
          echo "ROMs downloaded successfully."

      - name: Initialize Comparison Report
        env:
          ROM_URL_1: ${{ inputs.rom_url_1 }}
          ROM_URL_2: ${{ inputs.rom_url_2 }}
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          # Summary report
          echo "# Báo cáo so sánh ROM (ROM Comparison Report)" > compare_report.md
          echo "" >> compare_report.md
          echo "- **Thời gian thực hiện (UTC)**: $(date -u)" >> compare_report.md
          echo "- **ROM 1 (Cũ)**: [Link]($ROM_URL_1)" >> compare_report.md
          echo "- **ROM 2 (Mới)**: [Link]($ROM_URL_2)" >> compare_report.md
          echo "- **Phân vùng kiểm tra**: \`${{ inputs.partitions || 'auto: all super partitions' }}\`" >> compare_report.md
          echo "" >> compare_report.md
          echo "---" >> compare_report.md
          echo "" >> compare_report.md

          # Full report
          echo "# Báo cáo so sánh ROM Đầy đủ (Full ROM Comparison Report)" > compare_report_full.md
          echo "" >> compare_report_full.md
          echo "- **Thời gian thực hiện (UTC)**: $(date -u)" >> compare_report_full.md
          echo "- **ROM 1 (Cũ)**: [Link]($ROM_URL_1)" >> compare_report_full.md
          echo "- **ROM 2 (Mới)**: [Link]($ROM_URL_2)" >> compare_report_full.md
          echo "- **Phân vùng kiểm tra**: \`${{ inputs.partitions || 'auto: all super partitions' }}\`" >> compare_report_full.md
          echo "" >> compare_report_full.md
          echo "---" >> compare_report_full.md
          echo "" >> compare_report_full.md

      - name: Check ROM archive integrity
        run: |
          python3 - <<'PY'
          import zipfile
          for archive in ("rom1_temp/rom1.zip", "rom2_temp/rom2.zip"):
              if not zipfile.is_zipfile(archive):
                  raise SystemExit("Invalid or incomplete ROM ZIP: " + archive)
              with zipfile.ZipFile(archive) as z:
                  if not z.infolist():
                      raise SystemExit("Empty ROM ZIP: " + archive)
              print("ROM ZIP validated:", archive)
          PY

      - name: Set up filesystem extractors
        run: |
          missing=()
          command -v debugfs >/dev/null || missing+=(e2fsprogs)
          command -v simg2img >/dev/null || missing+=(android-sdk-libsparse-utils)
          command -v zstd >/dev/null || missing+=(zstd)
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${missing[@]}"
          fi
          command -v zstd
          command -v simg2img
          command -v debugfs

      - name: Compare Partitions Sequentially
        env:
          PARTITIONS: ${{ inputs.partitions }}
        run: |
          python3 -u builder/rom_compare_pipeline.py \
            --rom1 rom1_temp/rom1.zip \
            --rom2 rom2_temp/rom2.zip \
            --tools builder/tools \
            --partitions "$PARTITIONS" \
            --report compare_report.md \
            --full-report compare_report_full.md \
            --diff-out rom_diff_out

      - name: Package diff files
        if: always()
        run: |
          if [ -d "rom_diff_out" ] && [ "$(ls -A rom_diff_out)" ]; then
            echo "📦 Packaging different files..."
            (cd rom_diff_out && zip -r ../rom_diff.zip .)
            echo "✅ Created rom_diff.zip"
          else
            echo "ℹ️ No different files found to package."
          fi

      - name: Upload Diff Zip & Full Report to Gofile / Pixeldrain
        if: always()
        continue-on-error: true
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
          GOFILE_API_KEY: ${{ secrets.GOFILE_API_KEY }}
        run: |
          GOFILE_LINK=""
          PIXEL_LINK=""
          GOFILE_REPORT_LINK=""
          PIXEL_REPORT_LINK=""

          if [ -f "rom_diff.zip" ]; then
            echo "📤 Uploading diff package to storage services..."
            
            # Upload to Pixeldrain
            echo "📤 Uploading diff zip to Pixeldrain..."
            if [ -n "$PIXELDRAIN_API_KEY" ]; then
              PD_RES=$(curl -sf -u ":$PIXELDRAIN_API_KEY" -F "file=@rom_diff.zip" "https://pixeldrain.com/api/file" || true)
            else
              PD_RES=$(curl -sf -F "file=@rom_diff.zip" "https://pixeldrain.com/api/file" || true)
            fi
            PD_ID=$(echo "$PD_RES" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -n "$PD_ID" ]; then
              PIXEL_LINK="https://pixeldrain.com/u/${PD_ID}"
              echo "✅ Pixeldrain: $PIXEL_LINK"
            else
              echo "⚠️ Pixeldrain upload failed: $PD_RES"
            fi
            
            # Upload to Gofile
            echo "📤 Uploading diff zip to Gofile..."
            SERVER=$(curl -sf "https://api.gofile.io/servers" | jq -r '.data.servers[0].name // empty' 2>/dev/null || true)
            if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
              if [ -n "$GOFILE_API_KEY" ]; then
                GF_RES=$(curl -sf -H "Authorization: Bearer $GOFILE_API_KEY" -F "file=@rom_diff.zip" "https://${SERVER}.gofile.io/contents/uploadfile" || true)
              else
                GF_RES=$(curl -sf -F "file=@rom_diff.zip" "https://${SERVER}.gofile.io/contents/uploadfile" || true)
              fi
              GF_LINK=$(echo "$GF_RES" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [ -n "$GF_LINK" ]; then
                GOFILE_LINK="$GF_LINK"
                echo "✅ Gofile: $GOFILE_LINK"
              else
                echo "⚠️ Gofile upload failed: $GF_RES"
              fi
            fi
          fi

          if [ -f "compare_report_full.md" ]; then
            echo "📤 Uploading full comparison report to storage services..."
            
            # Upload report to Pixeldrain
            echo "📤 Uploading report to Pixeldrain..."
            if [ -n "$PIXELDRAIN_API_KEY" ]; then
              PD_RES=$(curl -sf -u ":$PIXELDRAIN_API_KEY" -F "file=@compare_report_full.md" "https://pixeldrain.com/api/file" || true)
            else
              PD_RES=$(curl -sf -F "file=@compare_report_full.md" "https://pixeldrain.com/api/file" || true)
            fi
            PD_ID=$(echo "$PD_RES" | jq -r '.id // empty' 2>/dev/null || true)
            if [ -n "$PD_ID" ]; then
              PIXEL_REPORT_LINK="https://pixeldrain.com/u/${PD_ID}"
              echo "✅ Pixeldrain Full Report: $PIXEL_REPORT_LINK"
            else
              echo "⚠️ Pixeldrain report upload failed: $PD_RES"
            fi
            
            # Upload report to Gofile
            echo "📤 Uploading report to Gofile..."
            SERVER=$(curl -sf "https://api.gofile.io/servers" | jq -r '.data.servers[0].name // empty' 2>/dev/null || true)
            if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
              if [ -n "$GOFILE_API_KEY" ]; then
                GF_RES=$(curl -sf -H "Authorization: Bearer $GOFILE_API_KEY" -F "file=@compare_report_full.md" "https://${SERVER}.gofile.io/contents/uploadfile" || true)
              else
                GF_RES=$(curl -sf -F "file=@compare_report_full.md" "https://${SERVER}.gofile.io/contents/uploadfile" || true)
              fi
              GF_LINK=$(echo "$GF_RES" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)
              if [ -n "$GF_LINK" ]; then
                GOFILE_REPORT_LINK="$GF_LINK"
                echo "✅ Gofile Full Report: $GOFILE_REPORT_LINK"
              else
                echo "⚠️ Gofile report upload failed: $GF_RES"
              fi
            fi
          fi

          # Append download/view links to report summary
          echo "### 📂 Tải xuống & Xem báo cáo" > temp_links.md
          if [ -n "$PIXEL_LINK" ] || [ -n "$GOFILE_LINK" ]; then
            echo "#### 📦 Các file khác biệt (ROM Diff Package)" >> temp_links.md
            [ -n "$PIXEL_LINK" ] && echo "- **Pixeldrain**: [Tải xuống]($PIXEL_LINK)" >> temp_links.md
            [ -n "$GOFILE_LINK" ] && echo "- **Gofile**: [Tải xuống]($GOFILE_LINK)" >> temp_links.md
          fi
          if [ -n "$PIXEL_REPORT_LINK" ] || [ -n "$GOFILE_REPORT_LINK" ]; then
            echo "#### 📄 Báo cáo so sánh đầy đủ (Full Report)" >> temp_links.md
            [ -n "$PIXEL_REPORT_LINK" ] && echo "- **Pixeldrain**: [Xem/Tải xuống]($PIXEL_REPORT_LINK)" >> temp_links.md
            [ -n "$GOFILE_REPORT_LINK" ] && echo "- **Gofile**: [Xem/Tải xuống]($GOFILE_REPORT_LINK)" >> temp_links.md
          fi
          echo "" >> temp_links.md
          echo "---" >> temp_links.md
          echo "" >> temp_links.md
          
          if [ -s temp_links.md ]; then
            cat temp_links.md compare_report.md > new_report.md
            mv -f new_report.md compare_report.md
          fi
          rm -f temp_links.md

      - name: Clean up remaining files
        if: always()
        run: |
          rm -rf rom1_temp rom2_temp rom_diff_out

      - name: Publish Summary
        if: always()
        run: |
          cat compare_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom_comparison_report
          path: compare_report*.md
